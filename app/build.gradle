plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apak.bilisim'
    compileSdk 34

    defaultConfig {
        applicationId "com.apak.bilisim"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Değerler CI'dan -P parametresiyle geliyor; lokal build için fallback debug
            storeFile = file(findProperty('android.injected.signing.store.file') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword = findProperty('android.injected.signing.store.password') ?: 'android'
            keyAlias = findProperty('android.injected.signing.key.alias') ?: 'androiddebugkey'
            keyPassword = findProperty('android.injected.signing.key.password') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
